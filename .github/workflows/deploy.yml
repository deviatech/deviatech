name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deviatech-production-release
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/analytics-checks.yml

  build-and-push:
    needs: validate
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    permissions:
      contents: read
      packages: read
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            umask 077
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            echo '${{ secrets.GITHUB_TOKEN }}' | docker --config "$tmp" login ghcr.io -u '${{ github.actor }}' --password-stdin
            export REPO_DIGEST='ghcr.io/deviatech/deviatech@${{ needs.build-and-push.outputs.digest }}'
            docker --config "$tmp" pull "$REPO_DIGEST"
            docker run --rm --network none --entrypoint cat "$REPO_DIGEST" /app/deploy-web.sh > "$tmp/deploy-web.sh"
            bash "$tmp/deploy-web.sh"
